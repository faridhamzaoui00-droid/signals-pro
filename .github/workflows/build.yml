name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.farid.signals --project-name signals_pro /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Configure manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Farid Hamzaoui Signals Pro"#' $M

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signals Pro build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
