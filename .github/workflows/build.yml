name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/signing
          key: signing-key-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/signing
          if [ ! -f ~/signing/upload.jks ]; then
            keytool -genkeypair -keystore ~/signing/upload.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass signalspro -keypass signalspro -dname "CN=Signals Pro, O=Personal"
          fi

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.farid.signals --project-name signals_pro /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Configure manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>'
          sed -i "s#<application#${PERMS}\n    <application#" $M
          sed -i 's#</application>#<service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />\n    </application>#' $M
          sed -i 's#android:label="[^"]*"#android:label="Farid Hamzaoui Signals Pro"#' $M

      - name: Patch Gradle for desugaring
        run: |
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          grv = 'android/app/build.gradle'
          if os.path.exists(kts):
              s = open(kts).read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  open(kts, 'w').write(s)
          elif os.path.exists(grv):
              s = open(grv).read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
                  open(grv, 'w').write(s)
          PY

      - name: Patch Gradle for fixed signing
        run: |
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          grv = 'android/app/build.gradle'
          if os.path.exists(kts):
              s = open(kts).read()
              old = 'signingConfigs.getByName("debug")'
              if old in s and 'create("release")' not in s:
                  blk = 'signingConfigs { create("release") { storeFile = file("/home/runner/signing/upload.jks"); storePassword = "signalspro"; keyAlias = "upload"; keyPassword = "signalspro" } }\n    '
                  i = s.find('buildTypes {')
                  if i > 0:
                      s = s[:i] + blk + s[i:]
                      s = s.replace(old, 'signingConfigs.getByName("release")')
                      open(kts, 'w').write(s)
          elif os.path.exists(grv):
              s = open(grv).read()
              old = 'signingConfig signingConfigs.debug'
              if old in s and 'release {\n            storeFile' not in s:
                  blk = "signingConfigs { release { storeFile file('/home/runner/signing/upload.jks'); storePassword 'signalspro'; keyAlias 'upload'; keyPassword 'signalspro' } }\n    "
                  i = s.find('buildTypes {')
                  if i > 0:
                      s = s[:i] + blk + s[i:]
                      s = s.replace(old, 'signingConfig signingConfigs.release')
                      open(grv, 'w').write(s)
          PY

      - run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Save error summary to repo
        if: failure()
        run: |
          {
            echo "=== DART ERRORS ==="
            grep -n -E "\.dart:[0-9]+:[0-9]+: Error" /tmp/build.log | head -30
            echo "=== GRADLE ==="
            grep -n -A 14 "What went wrong" /tmp/build.log | head -40
            echo "=== OTHER ==="
            grep -n -E "e: |error:|Execution failed|Could not|not found" /tmp/build.log | head -25
          } > build_error.txt
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build_error.txt
          git commit -m "build error summary" || true
          git push origin HEAD:main || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signals Pro build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
